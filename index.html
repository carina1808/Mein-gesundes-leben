function automaticHabitState(d,id){

  const m=(d.foodLog||{})[String(['breakfast','lunch','dinner'].indexOf(id))];

  return 'none';
 }
 if(id==='vegetables'){
  if(!meals.length)return 'none';

  return lightFor(count,lim.vegYellow,lim.vegGreen);
 }

 }

 if(id==='walk'){
  if(d.steps===undefined||d.steps===null||d.steps==='')return 'none';
  return lightFor(Number(d.steps),lim.stepsYellow,lim.stepsGreen);
 }
 if(id==='move'||id==='strength'){
  const activities=d.activities||[];
  const relevant=activities.filter(a=>{
   const type=String(a.type||'').toLowerCase();
   if(id==='strength')return type.includes('kraft')||type.includes('fitnessstudio');
   if(id==='walk')return false;
   return type.includes('mobilit')||type.includes('dehnen');
  });

  if(minutes>0)return lightFor(minutes,lim.activityYellow,lim.activityGreen);

}

function num(x){return Number(x).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})}function weightRows(){return Object.entries(db.weights).filter(([d,v])=>Number.isFinite(Number(v))).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,value])=>({date,value:Number(value)}))}function chart(rows){if(!rows.length)return '<p class="muted">Trage dein erstes Gewicht ein, um den Verlauf zu sehen.</p>';let points=rows.map(p=>{let window=rows.filter(x=>x.date<=p.date&&x.date>=shift(p.date,-6));return {...p,avg:window.reduce((v,x)=>v+x.value,0)/window.length}});let target=Number(db.weightGoal),start=Number(db.weightGoalStart)||weightRows()[0]?.value,goals=[];if(Number.isFinite(target)&&target>=30&&target<=350&&start&&target<start){for(let v=start-5;v>target;v-=5)goals.push({value:v,type:'step'});goals.push({value:target,type:'goal'})}let values=[...points.flatMap(p=>[p.value,p.avg]),...goals.map(g=>g.value)];let low=Math.min(...values)-.8,high=Math.max(...values)+.8;if(high-low<2){low-=1;high+=1}let x=i=>35+(points.length===1?125:i/(points.length-1)*265),y=v=>165-(v-low)/(high-low)*135;let poly=points.map((p,i)=>`${x(i)},${y(p.avg)}`).join(' ');let guides=goals.map(g=>`<line x1="35" x2="305" y1="${y(g.value)}" y2="${y(g.value)}" stroke="${g.type==='goal'?'#b96d5b':'#b5a26d'}" stroke-width="${g.type==='goal'?2:1.2}" stroke-dasharray="${g.type==='goal'?'6 3':'3 4'}"><title>${g.type==='goal'?'Ziel':'Etappe'}: ${num(g.value)} kg</title></line><text x="302" y="${y(g.value)-3}" font-size="9" text-anchor="end" fill="${g.type==='goal'?'#a04c3b':'#8d7841'}">${g.type==='goal'?'Ziel':'Etappe'} ${num(g.value)}</text>`).join('');return `<svg class="chart" viewBox="0 0 325 200" role="img" aria-label="Gewichtstrend mit Ziel und Etappen"><g stroke="#dce5df" stroke-dasharray="3 4">${[0,1,2,3,4].map(i=>`<line x1="35" x2="305" y1="${30+i*33.75}" y2="${30+i*33.75}"/>`).join('')}</g>${[0,1,2,3,4].map(i=>`<text x="30" y="${34+i*33.75}" font-size="10" text-anchor="end" fill="#69 function waistRows(){return Object.entries(db.waist||{}).filter(([d,v])=>Number.isFinite(Number(v))&&Number(v)>0).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,value])=>({date,value:Number(value)}))}function waistChart(rows){if(!rows.length)return '<p class="muted">Noch keine Bauchumfang-Messungen.</p>';let values=rows.map(x=>x.value),lo=Math.min(...values)-2,hi=Math.max(...values)+2,x=i=>35+(rows.length===1?130:i/(rows.length-1)*265),y=v=>165-(v-lo)/(hi-lo)*135;return `<svg class="chart" viewBox="0 0 325 200" role="img" aria-label="Bauchumfang im Zeitverlauf"><g stroke="#dce5df" stroke-dasharray="3 4">${[0,1,2,3,4].map(i=>`<line x1="35" x2="305" y1="${30+i*33.75}" y2="${30+i*33.75}"/>`).join('')}</g>${[0,1,2,3,4].map(i=>`<text x="30" y="${34+i*33.75}" font-size="10" text-anchor="end" fill="#697a6d">${num(hi-(hi-lo)*i/4)}</text>`).join('')}<polyline points="${rows.map((p,i)=>x(i)+','+y(p.value)).join(' ')}" stroke="#3a8a77" stroke-width="3" fill="none"/>${rows.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="4" fill="#3a8a77"><title>${p.date}: ${num(p.value)} cm</title></circle>`).join('')}<text x="35" y="189" font-size="10" fill="#697a6d">${fmtDate(rows[0].date)}</text><text x="305" y="189" font-size="10" text-anchor="end" fill="#697a6d">${fmtDate(rows.at(-1).date)}</text></svg>`}function bmiPanel(weight){let h=Number(db.heightCm);if(!h||h<100||h>230)return `<div class="card"><h3>BMI</h3><p class="muted">Trage deine Körpergröße ein, damit dein BMI berechnet werden kann.</p><div class="row"><input id="heightCm" type="number" min="100" max="230" step="0.1" inputmode="decimal" placeholder="Körpergröße in cm"><button id="saveHeight">Speichern</button></div></div>`;let bmi=weight?weight/(h/100)**2:null,percent=bmi===null?0:Math.min(100,Math.max(0,(bmi-15)/30*100));return `<div class="card"><div class="row"><h3>BMI</h3><button class="ghost" id="editHeight" aria-label="Körpergröße ändern">${num(h)} cm ✎</button></div>${bmi===null?'<p class="muted">Für den BMI feh function weightMilestones(){let all=weightRows(),first=all[0],last=all.at(-1),target=Number(db.weightGoal),valid=Number.isFinite(target)&&target>=30&&target<=350;let start=Number(db.weightGoalStart)||first?.value;let content='';if(valid&&start&&target<start){let current=last?.value??start,range=start-target,progress=Math.min(100,Math.max(0,(start-current)/range*100)),steps=[];for(let m=5;m<range;m+=5)steps.push(start-m);steps.push(target);content=`<div class="goal-progress"><div class="row"><strong>${num(current)} kg</strong><strong>Ziel ${num(target)} kg</strong></div><div class="bar"><div style="width:${progress}%"></div></div><div class="muted">${Math.round(progress)} % des Weges</div>${steps.map(w=>`<div class="row goal-step"><span>${w===target?'Ziel':'Etappe'}: ${num(w)} kg</span><span>${current<=w?'✓ Erreicht':'○ Offen'}</span></div>`).join('')}</div>`}else if(valid&&start&&target>=start){content='<p class="muted">Das Ziel muss unter deinem Startgewicht liegen.</p>'}return `<div class="card"><div class="row"><h3>Gewichtsmeilensteine</h3><button class="ghost weight-add" data-toggle-weight="goal" aria-label="Neues Gewichtsziel anlegen">+</button></div><div class="row goal-input weight-form" id="weightGoalForm" hidden><input id="goalWeight" type="number" min="30" max="350" step="0.1" inputmode="decimal" placeholder="Zielgewicht in kg" aria-label="Zielgewicht in Kilogramm" value="${valid?target:''}"><button id="saveGoal">Ziel speichern</button></div>${content}</div>`}
function weightAwards(){let all=weightRows(),first=all[0];if(!first)return '<div class="card"><h3>Meine Orden</h3><p class="muted">Deine ersten Erfolge erscheinen hier dauerhaft.</p></div>';let start=Number(db.weightGoalStart)||first.value;let earned=db.weightAwards&&typeof db.weightAwards==='object'?db.weightAwards:{};let found=[];let min=start;for(let p of all){if(p.date<first.date)continue;min=Math.min(min,p.value);for(let pct of [5,10]){if((start-min)/start*100>=pct&&!earned['p'+pct])earned['p'+pct]={date:p.date,label:pct+' % abgenommen',icon:'🏅'}}let high=Math.ceil(start/10)*10;for(let boundary=high;boundary>=Math.floor(min/10)*10;boundary-=10){if(boundary<=start&&min<boundary&&!earned['b'+boundary])earned['b'+boundary]={date:p.date,label:'Unter '+boundary+' kg',icon:'🥇'}}}db.weightAwards=earned;let list=Object.entries(earned).filter(([k,v])=>v&&v.label).sort((a,b)=>a[1].date.localeCompare(b[1].date));if(list.length){try{save()}catch(e){console.warn(e)}}return `<div class="card"><h3>Meine Orden</h3>${list.length?`<div class="award-grid">${list.map(([id,a])=>`<div class="award"><div class="award-icon">${a.icon||'🏅'}</div><strong>${esc(a.label)}</strong><span class="muted">${fmtDate(a.date)}</span></div>`).join('')}</div>`:'<p class="muted">Dein erster Orden wartet auf dich: 5 % weniger Gewicht oder eine neue Zehnergrenze.</p>'}</div>`}
function weights(){let all=weightRows(),cut=shift(localDate(),-(weightRange-1)),visible=all.filter(x=>weightRange===0||x.date>=cut),last=all.at(-1),first=all[0];let lastSeven=last?all.filter(x=>x.date>=shift(last.date,-6)&&x.date<=last.date):[];let avg=lastSeven.length?lastSeven.reduce((s,x)=>s+x.value,0)/lastSeven.length:null;let waists=waistRows(),lastWaist=waists.at(-1),waistDue=!lastWaist||shift(lastWaist.date,7)<=localDate();return `<div class="card"><h2>Mein Wiegetagebuch</h2><div class="grid2"><div class="stat"><div class="muted">Letztes Gewicht</div><div class="big">${last?num(last.value):'–'}</div><div class="muted">kg</div></div><div class="stat"><div class="muted">7-Tage-Durchschnitt</div><div class="big">${avg!==null?num(avg):'–'}</div><div class="muted">kg · ${lastSeven.length} Messungen</div></div></div><p class="muted">${first&&last?'Seit dem ersten Eintrag: '+(last.value-first.value>0?'+':'')+num(last.value-first.value)+' kg':'Dein erster Eintrag ist der Startpunkt.'}</p></div>${bmiPanel(last?.value)}${weightAwards()}${weightMilestones()}<div class="card"><div class="row"><h3>Gewicht eintragen</h3><button class="ghost weight-add" data-toggle-weight="entry" aria-label="Neuen Gewichtseintrag anlegen">+</button></div><div class="weight-form" id="weightEntryForm" hidden><label>Datum</label><input type="date" id="wdate" value="${date}" max="${localDate()}"><label>Gewicht in kg</label><input id="wvalue" inputmode="decimal" placeholder="z. B. 119,8" value="${db.weights[date]!==undefined?num(db.weights[date]):''}"><div class="waist-entry" ${waistDue?"":"hidden"}><label>Bauchumfang in cm (wöchentlich)</label><input id="waistValue" type="number" min="40" max="250" step="0.1" inputmode="decimal" placeholder="z. B. 105,5"><p class="small muted">${lastWaist?"Letzte Messung: "+num(lastWaist.value)+" cm am "+fmtDate(lastWaist.date):"Noch kein Bauchumfang erfasst."}</p></div><p><button id="addWeight">Eintrag speichern</button></p></div></div><div class="card"><div class="row"><h3>Verlauf</h3><select id="chartType" style="width:130px"><option value="weight" ${weightChartType==='weight'?'selected':''}>Gewicht</option><option value="waist" ${weightChartType==='waist'?'selected':''}>Bauchumfang</option></select><select id="range" style="width:135px"><option value="30" ${weightRange===30?'selected':''}>30 Tage</option><option value="90" ${weightRange===90?'selected':''}>90 Tage</option><option value="0" ${weightRange===0?'selected':''}>Alle</option></select></div>${weightChartType==='waist'?waistChart(waists.filter(x=>weightRange===0||x.date>=cut)):chart(visible)}</div><div class="card"><h3>Bauchumfang</h3>${waists.length?waists.slice(-8).reverse().map(x=>`<div class="entry row"><span>${fmtDate(x.date)}</span><span><b>${num(x.value)} cm</b> <button class="ghost" data-delete-waist="${x.date}" aria-label="Bauchumfang löschen">✕</button></span></div>`).join(''):'<p class="muted">Noch keine Messungen.</p>'}</div><div class="card"><h3>Letzte Messungen</h3>${all.length?all.slice(-14).reverse().map(p=>`<div class="entry row"><span>${fmtDate(p.date)}</span><span><b>${num(p.value)} kg</b> <button class="ghost" data-delete-weight="${p.date}" aria-label="Gewicht löschen">✕</button></span></div>`).join(''):'<p class="muted">Noch keine Messungen.</p>'}</div>`}

function render(){nav();const view=document.getElementById('view');try{const pages={gewohnheiten:habits,naschen:sweets,knie:knee,gewicht:weights,woche:weeklyReview,plan:mealPlan,settings:settings};view.innerHTML=(pages[tab]||mealPlan)()}catch(error){console.error('Ansicht konnte nicht geladen werden:',error);view.innerHTML='<div class="card"><h2>Ansicht konnte nicht geladen werden</h2><p>Fehler: '+esc(error.message)+' — Bitte melde diese Meldung, falls der Fehler bleibt.</p><button onclick="tab=\'plan\';render()">Zum Tagebuch</button></div>'}}function formatDuration(n){n=Math.max(0,Math.round(Number(n)||0));return Math.floor(n/60)+' Std. '+String(n%60).padStart(2,'0')+' Min.'}
function saveSleep(){let hr=document.getElementById('sleepH').value.trim(),mn=document.getElementById('sleepM').value.trim();if(hr===''&&mn===''){delete day().sleepHours}else{let h=Number(hr||0),m=Number(mn||0);if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||h>24||m<0||m>59||h*60+m>1440){toast('Bitte gültige Stunden und Minuten eingeben');return}day().sleepHours=(h*60+m)/60}save();sleepEditor=false;render();toast('Schlaf gespeichert')}function saveSteps(){let raw=document.getElementById('steps').value.trim(),n=Number(raw);if(raw!==''&&(!Number.isInteger(n)||n<0||n>100000)){toast('Bitte gültige Schrittzahl eingeben');return}let d=day();if(raw==='')delete d.steps;else d.steps=n;save();activityEditor=false;render();toast('Schritte gespeichert')}function addActivity(){let h=Number(document.getElementById('durationHours').value),m=Number(document.getElementById('durationMinutes').value),n=h*60+m;if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||m<0||m>59||n<1||n>600){toast('Bitte gültige Stunden und Minuten eingeben');return}day().activities.push({type:selectedSport,minutes:n});save();activityEditor=false;render();toast('Bewegung gespeichert')}function addWeight(){let d=document.getElementById('wdate').value,v=Number(document.getElementById('wvalue').value.replace(',','.'));if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d>localDate()||!Number.isFinite(v)||v<30||v>350){toast('Bitte gültiges Datum und Gewicht eingeben');return}db.weights[d]=Math.round(v*10)/10;let w=document.getElementById('waistValue');if(w&&w.value.trim()){let cm=Number(w.value.replace(',','.'));if(!Number.isFinite(cm)||cm<40||cm>250){toast('Bitte gültigen Bauchumfang eingeben');return}db.waist=db.waist||{};db.waist[d]=Math.round(cm*10)/10}date=d;save();render();toast('Eintrag gespeichert')}
